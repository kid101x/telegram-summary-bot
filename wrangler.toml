#:schema node_modules/wrangler/config-schema.json
name = "telegram-summary-bot"
main = "src/index.ts"
compatibility_date = "2024-11-12"
compatibility_flags = ["nodejs_compat"]

# Workers Logs
# Docs: https://developers.cloudflare.com/workers/observability/logs/workers-logs/
# Configuration: https://developers.cloudflare.com/workers/observability/logs/workers-logs/#enable-workers-logs
[observability]
enabled = true

# Automatically place your workloads in an optimal location to minimize latency.
# If you are running back-end logic in a Worker, running it closer to your back-end infrastructure
# rather than the end user may result in better performance.
# Docs: https://developers.cloudflare.com/workers/configuration/smart-placement/#smart-placement
[placement]
mode = "smart"

[triggers]
# 每天 UTC 15:23 (上海时间 23:23) 触发总结任务
# 每天 UTC 18:42 (上海时间 02:42) 触发清理任务
crons = ["23 15 * * *", "42 18 * * *"]

# Variable bindings. These are arbitrary, plaintext strings (similar to environment variables)
# Docs:
# - https://developers.cloudflare.com/workers/wrangler/configuration/#environment-variables
# Note: Use secrets to store sensitive data.
# - https://developers.cloudflare.com/workers/configuration/secrets/

# ... (d1_databases 和 triggers 部分保持不变) ...
[[d1_databases]]
binding = "DB"
database_name = "chat-msg-d1"
database_id = "12345-abcde-12345"

# ==================================
#  Prod Environment (Production)
# ==================================
[env.prod]
# It's good practice to give each environment a unique name to avoid conflicts.
name = "telegram-summary-bot"

[env.prod.vars]
ENV = "prod"
# AI_MODEL_NAME can be defined here or set as a secret for more flexibility.
AI_MODEL_NAME = "google-ai-studio/gemini-2.0-flash"
# Note: AI_BASE_URL is no longer needed here. The code will automatically construct it
# from the secrets below, which is a more secure practice.

# --- Secrets for Production ---
# Use 'npx wrangler secret put <SECRET_NAME>' to set these:
# - ACCOUNT_ID: Your Cloudflare Account ID.
# - AI_GATEWAY_ID: Your Production AI Gateway ID.
# - AI_API_KEY: Your AI provider's API key (e.g., for Gemini or OpenAI).
# - SECRET_TELEGRAM_API_TOKEN: Your Telegram Bot Token.
# - GIT_COMMIT_SHA: (Optional) Automatically set by CI/CD for the /version command.

# Bind a D1 database. D1 is Cloudflare’s native serverless SQL database.
# Docs: https://developers.cloudflare.com/workers/wrangler/configuration/#d1-databases

[[env.prod.d1_databases]]
binding = "DB"
database_name = "baijia-bot-db"
database_id = "804695f9-9af3-438a-b605-2050f4413094"

# ==================================
#  Dev-Test Environment
# ==================================
[env.dev-test]
# It's good practice to give each environment a unique name to avoid conflicts.
name = "telegram-summary-test"

[env.dev-test.vars]
ENV = "dev-test"
AI_MODEL_NAME = "google-ai-studio/gemini-2.0-flash" # Model for testing
# Secrets for dev-test are the same as production, but should point to test resources.

# !!! IMPORTANT !!!
# Replace the database_name and database_id with your actual dev-test database values.
[[env.dev-test.d1_databases]]
binding = "DB"
database_name = "baijiabot-t-db"
database_id = "4ea82938-ef09-42f0-a7d4-c0b30d304a29"

# ==================================
#  Local Development Environment
# ==================================
[env.local-demo]
name = "telegram-summary-local"

[env.local-demo.vars]
ENV = "local-demo"
# This flag explicitly enables the direct connection mode using AI_BASE_URL.
FORCE_USE_AI_BASE_URL = "true"
# --- Important Note on `wrangler dev` ---
# Due to Telegram's Webhook requirements (requiring a public HTTPS URL),
# `wrangler dev` cannot be used for end-to-end testing of this bot.
# This environment is primarily for deploying to a test Worker that uses a
# local or custom AI endpoint via a secure tunnel (e.g., cloudflared tunnel).
#
# For local development, it is recommended to define AI_BASE_URL and AI_MODEL_NAME
# in a separate `.dev.vars.local-demo` file. See DEPLOYMENT_GUIDE.md for details.
AI_BASE_URL = "http://localhost:11434/v1"
AI_MODEL_NAME = "llama3"

# You can use the same test database for local demo, or define a new one.
[[env.local-demo.d1_databases]]
binding = "DB"
database_name = "baijiabot-t-db"
database_id = "4ea82938-ef09-42f0-a7d4-c0b30d304a29"
